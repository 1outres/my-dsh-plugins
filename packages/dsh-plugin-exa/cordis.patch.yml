# Installs this plugin on its own (dsh plugin add @1outres/dsh-plugin-exa).
# The @1outres/dsh-plugins bundle inserts the same "exa" row, so select
# one bundle or the other, never both.
- insert:
    - id: exa
      name: "@1outres/dsh-plugin-exa"

# An override replaces the row's whole config, so both fields are listed.
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: exa
    fetchProvider: exa
