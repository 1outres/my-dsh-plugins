# Row ids are the settings namespaces the plugins read. Disable a row here (or
# in your profile patch) to turn that plugin off without uninstalling it.
#
# Each plugin package also ships this row as its own one-row bundle. Select
# either this bundle or a plugin's own bundle for a given plugin, never both.
- insert:
    - id: background
      name: "@1outres/dsh-plugin-background"
    - id: notify
      name: "@1outres/dsh-plugin-notify"
    - id: claude-subscription
      name: "@1outres/dsh-plugin-claude-subscription"
